<svg width="100%" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ChatHub architecture overview</title>
  <desc id="desc">Two clients (browser JS and Blazor) connect via WebSocket to a SignalR Hub that delegates work to three services backed by interfaces.</desc>

  <style>
    .label-primary { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #1a1a1a; }
    .label-secondary { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 400; fill: #555; }
    .label-tier { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 500; fill: #888; }
    .arrow { stroke: #888; stroke-width: 1.5; fill: none; }

    /* Light mode colors (default) */
    .box-blue { fill: #E6F1FB; stroke: #185FA5; stroke-width: 1; }
    .box-blue-text { fill: #042C53; }
    .box-purple { fill: #EEEDFE; stroke: #534AB7; stroke-width: 1; }
    .box-purple-text { fill: #26215C; }
    .box-coral { fill: #FAECE7; stroke: #993C1D; stroke-width: 1; }
    .box-coral-text { fill: #4A1B0C; }
    .box-teal { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1; }
    .box-teal-text { fill: #04342C; }
    .box-gray { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 1; }
    .box-gray-text { fill: #2C2C2A; }

    /* Dark mode adjustments */
    @media (prefers-color-scheme: dark) {
      .label-primary { fill: #f4f4f8; }
      .label-secondary { fill: #b4b6c4; }
      .label-tier { fill: #888; }
      .arrow { stroke: #999; }

      .box-blue { fill: #0C447C; stroke: #B5D4F4; }
      .box-blue-text { fill: #E6F1FB; }
      .box-purple { fill: #3C3489; stroke: #CECBF6; }
      .box-purple-text { fill: #EEEDFE; }
      .box-coral { fill: #712B13; stroke: #F5C4B3; }
      .box-coral-text { fill: #FAECE7; }
      .box-teal { fill: #085041; stroke: #9FE1CB; }
      .box-teal-text { fill: #E1F5EE; }
      .box-gray { fill: #444441; stroke: #D3D1C7; }
      .box-gray-text { fill: #F1EFE8; }
    }
  </style>

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- TIER 1: CLIENTS -->
  <text class="label-tier" x="40" y="30">Clients (browser side)</text>

  <rect class="box-blue" x="40" y="44" width="280" height="56" rx="8"/>
  <text class="label-primary box-blue-text" x="180" y="68" text-anchor="middle">JavaScript klient</text>
  <text class="label-secondary box-blue-text" x="180" y="86" text-anchor="middle">index.html + ES modules</text>

  <rect class="box-purple" x="360" y="44" width="280" height="56" rx="8"/>
  <text class="label-primary box-purple-text" x="500" y="68" text-anchor="middle">Blazor klient</text>
  <text class="label-secondary box-purple-text" x="500" y="86" text-anchor="middle">Chat.razor + ChatClientService</text>

  <!-- WebSocket arrows down -->
  <text class="label-secondary" x="180" y="125" text-anchor="middle">WebSocket</text>
  <line x1="170" y1="100" x2="170" y2="208" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="190" y1="208" x2="190" y2="100" class="arrow" marker-end="url(#arrowhead)"/>

  <text class="label-secondary" x="500" y="125" text-anchor="middle">WebSocket</text>
  <line x1="490" y1="100" x2="490" y2="208" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="510" y1="208" x2="510" y2="100" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- TIER 2: HUB -->
  <text class="label-tier" x="40" y="195">Backend (ASP.NET Core)</text>

  <rect class="box-coral" x="40" y="210" width="600" height="60" rx="8"/>
  <text class="label-primary box-coral-text" x="340" y="234" text-anchor="middle">ChatHub</text>
  <text class="label-secondary box-coral-text" x="340" y="254" text-anchor="middle">Thin orchestration: receives invokes, delegates, broadcasts</text>

  <!-- Arrows down to services -->
  <line x1="160" y1="270" x2="160" y2="318" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="340" y1="270" x2="340" y2="318" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="520" y1="270" x2="520" y2="318" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- TIER 3: SERVICES -->
  <text class="label-tier" x="40" y="305">Services (injected via DI)</text>

  <rect class="box-teal" x="40" y="320" width="240" height="60" rx="8"/>
  <text class="label-primary box-teal-text" x="160" y="344" text-anchor="middle">UserPresenceService</text>
  <text class="label-secondary box-teal-text" x="160" y="364" text-anchor="middle">Tracks who is in which room</text>

  <rect class="box-teal" x="290" y="320" width="100" height="60" rx="8"/>
  <text class="label-primary box-teal-text" x="340" y="344" text-anchor="middle">Avatar</text>
  <text class="label-secondary box-teal-text" x="340" y="364" text-anchor="middle">Service</text>

  <rect class="box-teal" x="400" y="320" width="240" height="60" rx="8"/>
  <text class="label-primary box-teal-text" x="520" y="344" text-anchor="middle">MessageHistoryService</text>
  <text class="label-secondary box-teal-text" x="520" y="364" text-anchor="middle">Buffer of last 100 per room</text>

  <!-- Implements arrows -->
  <text class="label-secondary" x="160" y="402" text-anchor="middle">implements</text>
  <text class="label-secondary" x="340" y="402" text-anchor="middle">implements</text>
  <text class="label-secondary" x="520" y="402" text-anchor="middle">implements</text>

  <line x1="160" y1="380" x2="160" y2="420" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="340" y1="380" x2="340" y2="420" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="520" y1="380" x2="520" y2="420" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- TIER 4: INTERFACES -->
  <rect class="box-gray" x="40" y="420" width="240" height="50" rx="8"/>
  <text class="label-primary box-gray-text" x="160" y="450" text-anchor="middle">IUserPresenceService</text>

  <rect class="box-gray" x="290" y="420" width="100" height="50" rx="8"/>
  <text class="label-primary box-gray-text" x="340" y="450" text-anchor="middle">IAvatar</text>

  <rect class="box-gray" x="400" y="420" width="240" height="50" rx="8"/>
  <text class="label-primary box-gray-text" x="520" y="450" text-anchor="middle">IMessageHistoryService</text>

  <!-- Caption -->
  <text class="label-secondary" x="340" y="500" text-anchor="middle">Hub depends on interfaces (top-down). Services live in their own files. One responsibility each.</text>
</svg>
