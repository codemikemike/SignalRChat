<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 720" width="680" height="720">
  <title>ChatHub architecture with Dependency Inversion</title>
  <desc>ChatHub depends on interfaces, not on concrete services. The DI container binds the interface to its implementation at runtime.</desc>

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- White background so it works on any GitHub theme -->
  <rect x="0" y="0" width="680" height="720" fill="#ffffff"/>

  <!-- TIER 1: CLIENTS -->
  <text x="40" y="30" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" font-weight="500" fill="#888">1. Clients (browser side)</text>

  <rect x="40" y="44" width="280" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="180" y="68" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#042C53" text-anchor="middle">JavaScript klient</text>
  <text x="180" y="86" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="middle">index.html + ES modules</text>

  <rect x="360" y="44" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="500" y="68" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#26215C" text-anchor="middle">Blazor klient</text>
  <text x="500" y="86" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#3C3489" text-anchor="middle">Chat.razor</text>

  <!-- WebSocket arrows (clients to hub) -->
  <text x="180" y="125" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-style="italic" fill="#666" text-anchor="middle">WebSocket (begge veje)</text>
  <line x1="170" y1="100" x2="170" y2="170" stroke="#888" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="190" y1="170" x2="190" y2="100" stroke="#888" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <text x="500" y="125" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-style="italic" fill="#666" text-anchor="middle">WebSocket (begge veje)</text>
  <line x1="490" y1="100" x2="490" y2="170" stroke="#888" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="510" y1="170" x2="510" y2="100" stroke="#888" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- TIER 2: HUB -->
  <text x="40" y="195" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" font-weight="500" fill="#888">2. Hub (orkestrering)</text>

  <rect x="40" y="210" width="600" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="340" y="234" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#4A1B0C" text-anchor="middle">ChatHub</text>
  <text x="340" y="254" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="middle">Constructor: ChatHub(IUserPresenceService, IAvatarService, IMessageHistoryService)</text>

  <!-- Hub depends on Interfaces -->
  <text x="160" y="295" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-style="italic" fill="#666" text-anchor="middle">depends on</text>
  <text x="340" y="295" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-style="italic" fill="#666" text-anchor="middle">depends on</text>
  <text x="520" y="295" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-style="italic" fill="#666" text-anchor="middle">depends on</text>
  <line x1="160" y1="270" x2="160" y2="320" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="340" y1="270" x2="340" y2="320" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="520" y1="270" x2="520" y2="320" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- TIER 3: INTERFACES -->
  <text x="40" y="335" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" font-weight="500" fill="#888">3. Interfaces (kontrakter)</text>

  <rect x="40" y="350" width="240" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="160" y="380" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle">IUserPresenceService</text>

  <rect x="290" y="350" width="100" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="380" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle">IAvatar</text>

  <rect x="400" y="350" width="240" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="520" y="380" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle">IMessageHistoryService</text>

  <!-- Services implements Interfaces (arrows pointing UP) -->
  <text x="160" y="425" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-style="italic" fill="#666" text-anchor="middle">implements</text>
  <text x="340" y="425" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-style="italic" fill="#666" text-anchor="middle">implements</text>
  <text x="520" y="425" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-style="italic" fill="#666" text-anchor="middle">implements</text>
  <line x1="160" y1="450" x2="160" y2="400" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="340" y1="450" x2="340" y2="400" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="520" y1="450" x2="520" y2="400" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- TIER 4: CONCRETE SERVICES -->
  <text x="40" y="465" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" font-weight="500" fill="#888">4. Konkrete services (implementations)</text>

  <rect x="40" y="480" width="240" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="160" y="504" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#04342C" text-anchor="middle">UserPresenceService</text>
  <text x="160" y="524" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="middle">ConcurrentDictionary</text>

  <rect x="290" y="480" width="100" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="504" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#04342C" text-anchor="middle">Avatar</text>
  <text x="340" y="524" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="middle">DiceBear</text>

  <rect x="400" y="480" width="240" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="520" y="504" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#04342C" text-anchor="middle">MessageHistoryService</text>
  <text x="520" y="524" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="middle">In-memory buffer (100)</text>

  <!-- DI Container -->
  <rect x="40" y="580" width="600" height="70" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="340" y="605" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#412402" text-anchor="middle">DI Container (ServiceCollectionExtensions.cs)</text>
  <text x="340" y="625" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="middle">services.AddSingleton&lt;IUserPresenceService, UserPresenceService&gt;()</text>
  <text x="340" y="642" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="middle">Mapper interface → konkret klasse ved app startup</text>

  <!-- Caption -->
  <text x="340" y="695" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#666" text-anchor="middle">Hub kender KUN interfaces. DI-containeren leverer den konkrete service ved runtime. = Dependency Inversion (D i SOLID)</text>
</svg>
