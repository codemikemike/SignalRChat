<svg width="100%" viewBox="0 0 680 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ChatHub architecture with Dependency Inversion</title>
  <desc id="desc">ChatHub depends on interfaces, not on concrete services. The DI container binds the interface to its implementation at runtime.</desc>

  <style>
    .label-primary { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; }
    .label-secondary { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 400; }
    .label-tier { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 500; fill: #888; }
    .label-arrow { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; font-weight: 400; font-style: italic; fill: #666; }
    .arrow { stroke: #888; stroke-width: 1.5; fill: none; }
    .arrow-bold { stroke: #555; stroke-width: 2; fill: none; }

    /* Light mode (default) */
    .box-blue { fill: #E6F1FB; stroke: #185FA5; stroke-width: 1; }
    .box-blue-text { fill: #042C53; }
    .box-purple { fill: #EEEDFE; stroke: #534AB7; stroke-width: 1; }
    .box-purple-text { fill: #26215C; }
    .box-coral { fill: #FAECE7; stroke: #993C1D; stroke-width: 1; }
    .box-coral-text { fill: #4A1B0C; }
    .box-teal { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1; }
    .box-teal-text { fill: #04342C; }
    .box-gray { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 1; }
    .box-gray-text { fill: #2C2C2A; }
    .box-amber { fill: #FAEEDA; stroke: #BA7517; stroke-width: 1; }
    .box-amber-text { fill: #412402; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      .label-tier { fill: #888; }
      .label-arrow { fill: #aaa; }
      .arrow { stroke: #999; }
      .arrow-bold { stroke: #bbb; }

      .box-blue { fill: #0C447C; stroke: #B5D4F4; }
      .box-blue-text { fill: #E6F1FB; }
      .box-purple { fill: #3C3489; stroke: #CECBF6; }
      .box-purple-text { fill: #EEEDFE; }
      .box-coral { fill: #712B13; stroke: #F5C4B3; }
      .box-coral-text { fill: #FAECE7; }
      .box-teal { fill: #085041; stroke: #9FE1CB; }
      .box-teal-text { fill: #E1F5EE; }
      .box-gray { fill: #444441; stroke: #D3D1C7; }
      .box-gray-text { fill: #F1EFE8; }
      .box-amber { fill: #633806; stroke: #FAC775; }
      .box-amber-text { fill: #FAEEDA; }
    }
  </style>

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- TIER 1: CLIENTS -->
  <text class="label-tier" x="40" y="30">1. Clients (browser side)</text>

  <rect class="box-blue" x="40" y="44" width="280" height="56" rx="8"/>
  <text class="label-primary box-blue-text" x="180" y="68" text-anchor="middle">JavaScript klient</text>
  <text class="label-secondary box-blue-text" x="180" y="86" text-anchor="middle">index.html + ES modules</text>

  <rect class="box-purple" x="360" y="44" width="280" height="56" rx="8"/>
  <text class="label-primary box-purple-text" x="500" y="68" text-anchor="middle">Blazor klient</text>
  <text class="label-secondary box-purple-text" x="500" y="86" text-anchor="middle">Chat.razor</text>

  <!-- WebSocket arrows -->
  <text class="label-arrow" x="180" y="125" text-anchor="middle">WebSocket (begge veje)</text>
  <line x1="170" y1="100" x2="170" y2="170" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="190" y1="170" x2="190" y2="100" class="arrow" marker-end="url(#arrowhead)"/>

  <text class="label-arrow" x="500" y="125" text-anchor="middle">WebSocket (begge veje)</text>
  <line x1="490" y1="100" x2="490" y2="170" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="510" y1="170" x2="510" y2="100" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- TIER 2: HUB -->
  <text class="label-tier" x="40" y="195">2. Hub (orkestrering)</text>

  <rect class="box-coral" x="40" y="210" width="600" height="60" rx="8"/>
  <text class="label-primary box-coral-text" x="340" y="234" text-anchor="middle">ChatHub</text>
  <text class="label-secondary box-coral-text" x="340" y="254" text-anchor="middle">Constructor: ChatHub(IUserPresenceService, IAvatarService, IMessageHistoryService)</text>

  <!-- Hub → Interfaces (depends on) -->
  <text class="label-arrow" x="160" y="295" text-anchor="middle">depends on</text>
  <text class="label-arrow" x="340" y="295" text-anchor="middle">depends on</text>
  <text class="label-arrow" x="520" y="295" text-anchor="middle">depends on</text>
  <line x1="160" y1="270" x2="160" y2="320" class="arrow-bold" marker-end="url(#arrowhead)"/>
  <line x1="340" y1="270" x2="340" y2="320" class="arrow-bold" marker-end="url(#arrowhead)"/>
  <line x1="520" y1="270" x2="520" y2="320" class="arrow-bold" marker-end="url(#arrowhead)"/>

  <!-- TIER 3: INTERFACES -->
  <text class="label-tier" x="40" y="335">3. Interfaces (kontrakter)</text>

  <rect class="box-gray" x="40" y="350" width="240" height="50" rx="8"/>
  <text class="label-primary box-gray-text" x="160" y="380" text-anchor="middle">IUserPresenceService</text>

  <rect class="box-gray" x="290" y="350" width="100" height="50" rx="8"/>
  <text class="label-primary box-gray-text" x="340" y="380" text-anchor="middle">IAvatar</text>

  <rect class="box-gray" x="400" y="350" width="240" height="50" rx="8"/>
  <text class="label-primary box-gray-text" x="520" y="380" text-anchor="middle">IMessageHistoryService</text>

  <!-- Interfaces ← Services (implements) -->
  <text class="label-arrow" x="160" y="425" text-anchor="middle">implements</text>
  <text class="label-arrow" x="340" y="425" text-anchor="middle">implements</text>
  <text class="label-arrow" x="520" y="425" text-anchor="middle">implements</text>
  <line x1="160" y1="450" x2="160" y2="400" class="arrow-bold" marker-end="url(#arrowhead)"/>
  <line x1="340" y1="450" x2="340" y2="400" class="arrow-bold" marker-end="url(#arrowhead)"/>
  <line x1="520" y1="450" x2="520" y2="400" class="arrow-bold" marker-end="url(#arrowhead)"/>

  <!-- TIER 4: CONCRETE SERVICES -->
  <text class="label-tier" x="40" y="465">4. Konkrete services (implementations)</text>

  <rect class="box-teal" x="40" y="480" width="240" height="60" rx="8"/>
  <text class="label-primary box-teal-text" x="160" y="504" text-anchor="middle">UserPresenceService</text>
  <text class="label-secondary box-teal-text" x="160" y="524" text-anchor="middle">ConcurrentDictionary</text>

  <rect class="box-teal" x="290" y="480" width="100" height="60" rx="8"/>
  <text class="label-primary box-teal-text" x="340" y="504" text-anchor="middle">Avatar</text>
  <text class="label-secondary box-teal-text" x="340" y="524" text-anchor="middle">DiceBear</text>

  <rect class="box-teal" x="400" y="480" width="240" height="60" rx="8"/>
  <text class="label-primary box-teal-text" x="520" y="504" text-anchor="middle">MessageHistoryService</text>
  <text class="label-secondary box-teal-text" x="520" y="524" text-anchor="middle">In-memory buffer (100)</text>

  <!-- DI Container -->
  <rect class="box-amber" x="40" y="580" width="600" height="70" rx="8"/>
  <text class="label-primary box-amber-text" x="340" y="605" text-anchor="middle">DI Container (ServiceCollectionExtensions.cs)</text>
  <text class="label-secondary box-amber-text" x="340" y="625" text-anchor="middle">services.AddSingleton&lt;IUserPresenceService, UserPresenceService&gt;()</text>
  <text class="label-secondary box-amber-text" x="340" y="642" text-anchor="middle">Mapper interface → konkret klasse ved app startup</text>

  <!-- Caption -->
  <text class="label-secondary" x="340" y="695" text-anchor="middle" fill="#666">Hub kender KUN interfaces. DI-containeren leverer den konkrete service ved runtime. = Dependency Inversion (D i SOLID)</text>
</svg>
